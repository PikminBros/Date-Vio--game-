<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Vio Game</title>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-highlight: rgba(255, 255, 255, 0.45);
      --accent: #ffd62e;
      --text: #fff8e1;
      --glow: rgba(255, 214, 46, 0.4);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 25% 25%, rgba(255, 235, 59, 0.35), transparent 45%),
        radial-gradient(circle at 75% 75%, rgba(255, 167, 38, 0.3), transparent 50%),
        linear-gradient(160deg, #3a2e00 0%, #4a3800 50%, #2c2200 100%);
      background-attachment: fixed;
    }

    header, main, footer {
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.04) 100%
      );
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-highlight);
      border-radius: 12px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    header {
      padding: 1.25rem 2rem;
      margin: 1rem;
    }

    h1, h2 {
      text-shadow: 0 0 12px var(--glow);
      letter-spacing: 0.5px;
    }

    nav a {
      display: inline-block;
      margin-right: 0.75rem;
      padding: 0.4rem 1.1rem;
      color: var(--text);
      text-decoration: none;
      border-radius: 8px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-highlight);
      transition: all 0.2s ease;
    }
    nav a:hover {
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 0 14px var(--glow);
      transform: translateY(-1px);
    }

    main {
      max-width: 860px;
      margin: 1.5rem auto;
      padding: 2rem;
    }

    .glass-image {
      position: relative;
      display: inline-block;
      border-radius: 12px;
      padding: 4px;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.2) 0%,
        rgba(255, 255, 255, 0.05) 100%
      );
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-highlight);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .glass-image img {
      display: block;
      width: 100%;
      max-width: 315px;
      border-radius: 9px;
    }
    .glass-image::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px;
      height: 45%;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.12), transparent);
      border-radius: 9px 9px 50% 50%;
      pointer-events: none;
    }

    input {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-top-color: var(--glass-highlight);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      outline: none;
      transition: box-shadow 0.2s;
    }
    input:focus {
      box-shadow: 0 0 0 2px var(--glow);
    }

    .aero-btn {
      display: inline-block;
      padding: 0.75rem 2.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-decoration: none;
      color: #1a1400;
      position: relative;
      cursor: pointer;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.35) 0%,
        rgba(255, 214, 46, 0.2) 100%);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 214, 46, 0.4);
      border-top-color: rgba(255, 255, 255, 0.6);
      border-bottom-color: rgba(255, 214, 46, 0.15);
      border-radius: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5),
                  0 4px 12px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }
    .aero-btn::before {
      content: '';
      position: absolute;
      top: 1px; left: 8px; right: 8px;
      height: 45%;
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.25), transparent);
      border-radius: 6px 6px 50% 50%;
      pointer-events: none;
    }
    .aero-btn:hover {
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.45), rgba(255, 214, 46, 0.3));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6),
                  0 6px 20px rgba(0, 0, 0, 0.5),
                  0 0 20px var(--glow);
      transform: translateY(-1px);
    }
    .aero-btn:active {
      transform: translateY(1px);
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.25);
    }

    footer {
      text-align: center;
      padding: 1rem;
      margin: 1.5rem 1rem 1rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Date Vio Game</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="home">
    <h2>Hey, welcome to the Date Vio website.</h2>
    <p>You can play the game here</p>

    <div class="glass-image">
      <img src="https://img.itch.zone/aW1nLzMxNzMyNTc3LnBuZw==/315x250%23c/uh0Fip.png" alt="Date Vio image">
    </div>

    <h2 id="about">About</h2>
    <p>This website is for the Date Vio joke game that was made in Ren'Py. Click below to play.</p>

    <a href="https://pikminbros.github.io/Date-Vio--game-/thewholeahhgame/index.html" class="aero-btn">
      <span>play the game please let me fufill my job please [▶]</span>
    </a>
  </main>

  <footer>
    <p>Hi, my name's Text. You found me. YIPEE</p>
  </footer>
</body>
</html>
