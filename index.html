<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Basic Page</title>
  <style>
    :root {
      --bg: #121212;
      --surface: #1e1e1e;
      --text: #e0e0e0;
      --accent: #4fc3f7;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--surface);
      padding: 1rem 2rem;
      border-bottom: 1px solid #333;
    }
    nav a {
      color: var(--accent);
      margin-right: 1rem;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    img {
      max-width: 100%;
      border-radius: 8px;
    }
    input {
      background: var(--surface);
      border: 1px solid #444;
      color: var(--text);
      padding: 0.4rem;
      border-radius: 4px;
    }
    button {
      background: var(--accent);
      border: none;
      color: #121212;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 1rem;
      background: var(--surface);
      margin-top: 2rem;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <header>
    <h1>Date Vio Game</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="home">
    <h2>Hey, welcome to the Date Vio website.</h2>
    <p>You can play the game here</p>

    <img src="https://img.itch.zone/aW1nLzMxNzMyNTc3LnBuZw==/315x250%23c/uh0Fip.png" alt="Date Vio image">

    <h2 id="about">About</h2>
    <p>This website is for the Date Vio joke game that was made in Ren'Py. Click below to play.</p>

<a href="https://pikminbros.github.io/Date-Vio--game-/thewholeahhgame/index.html" class="btn">Play the game [▶]</a>

<style>
  .btn {
    display: inline-block;
    background: #4fc3f7;
    color: #121212;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    text-decoration: none;
  }
  .btn:hover {
    opacity: 0.85;
  }
</style>

  <footer>
    <p>Hi, my name's Text. You found me. YIPEE</p>
  </footer>
</body>
</html>
